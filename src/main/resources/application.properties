spring.config.import=optional:file:./AgendaServer-Database.properties,optional:file:C:/Projetos/AgendaServer/AgendaServer-Database.properties
spring.application.name=AgendaServer
agenda.scheduling.enabled=${AGENDA_SCHEDULING_ENABLED:true}
server.port=${AGENDA_SERVER_PORT:28212}
server.error.include-message=always
server.forward-headers-strategy=framework

spring.datasource.url=${AGENDA_DB_URL:jdbc:postgresql://localhost:5432/agenda}
spring.datasource.username=${AGENDA_DB_USER:agenda_app}
spring.datasource.password=${AGENDA_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${AGENDA_DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=15000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=31MB
agenda.upload.dir=${AGENDA_UPLOAD_DIR:${user.home}/appdata/agenda}
agenda.cors.allowed-origins=${AGENDA_CORS_ALLOWED_ORIGINS:*}
agenda.session.days=${AGENDA_SESSION_DAYS:90}

assistant.openai.api-key=${OPENAI_API_KEY:}
agenda.vision.model=${AGENDA_VISION_MODEL:gpt-5.1}

# Administração e prospecção externa. Nenhum segredo deve ser gravado neste arquivo.
agenda.admin.emails=${AGENDA_ADMIN_EMAILS:lixocwb@gmail.com}
agenda.production=${PRODUCAO:false}
agenda.prospecting.enabled=${AGENDA_PROSPECTING_ENABLED:true}
agenda.prospecting.dry-run=${AGENDA_PROSPECTING_DRY_RUN:true}
agenda.prospecting.auto-dry-run=${AGENDA_AUTOMATIC_DRY_RUN_ENABLED:true}
agenda.email.sending-enabled=${AGENDA_EMAIL_SENDING_ENABLED:false}
agenda.prospecting.radius-km=${AGENDA_EXTERNAL_INVITE_RADIUS_KM:2}
agenda.prospecting.limit-per-task=${AGENDA_EXTERNAL_INVITE_LIMIT_PER_TASK:20}
agenda.prospecting.daily-limit=${AGENDA_EXTERNAL_INVITE_DAILY_LIMIT:5}
agenda.prospecting.cooldown-days=${AGENDA_EXTERNAL_INVITE_COOLDOWN_DAYS:90}
agenda.prospecting.token-hours=${AGENDA_EXTERNAL_INVITE_TOKEN_HOURS:72}
agenda.prospecting.data-key=${AGENDA_PROSPECT_DATA_KEY:}
agenda.prospecting.key-file=${AGENDA_PROSPECT_KEY_FILE:${user.home}/appdata/agenda/prospecting.key}
agenda.cnpj.import-dir=${AGENDA_CNPJ_IMPORT_DIR:}
agenda.geocoder.provider=${AGENDA_GEOCODER_PROVIDER:mock}
agenda.geocoder.url=${AGENDA_GEOCODER_URL:}
agenda.geocoder.api-key=${AGENDA_GEOCODER_API_KEY:}
agenda.email.check-mx=${AGENDA_EMAIL_CHECK_MX:false}
agenda.email.repeated-threshold=${AGENDA_EMAIL_REPEATED_THRESHOLD:20}
agenda.smtp.host=${AGENDA_SMTP_HOST:}
agenda.smtp.port=${AGENDA_SMTP_PORT:587}
agenda.smtp.username=${AGENDA_SMTP_USERNAME:}
agenda.smtp.password=${AGENDA_SMTP_PASSWORD:}
agenda.smtp.from=${AGENDA_SMTP_FROM:}
agenda.public-web-url=${AGENDA_PUBLIC_WEB_URL:http://127.0.0.1:5500}
